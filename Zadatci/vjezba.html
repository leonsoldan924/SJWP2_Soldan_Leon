<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vjezba</title>
  </head>
  <body>
    <h1>Zadatak 1</h1>
    <svg width="600" height="500">
      <rect
        x="30"
        y="30"
        width="450"
        height="400"
        fill="lightblue"
        stroke="black"
        stroke-width="3"
      />

      <rect x="31" y="300" width="448" height="130" fill="blue" />

      <rect x="120" y="280" width="160" height="50" fill="brown" />
      <polygon points="200,160 130,270 270,270" fill="white" />

      <polygon points="190,125 150,140 190,155" fill="#16960C" />

      <rect x="195" y="120" width="12" height="160" fill="black" />
      <circle cx="400" cy="100" r="50" fill="yellow" />
    </svg>

    <h1>Zadatak 2</h1>

    <svg width="600" height="500">
      <rect x="31" y="0" width="448" height="430" fill="#f2dac1" />

      <rect x="31" y="320" width="448" height="110" fill="#f5f3e8" />

      <path d="M 30 330 A 140 40 0 0 1 480 330" fill="#f5f3e8" />
      <!-- lijeva strana -->
      <rect x="203" y="260" width="5" height="60" fill="gray" />

      <rect x="132" y="320" width="8" height="60" fill="gray" />

      <polygon points="135,160 100,350 170,350" fill="#337d65" />

      <polygon points="205,180 180,300 230,300" fill="#337d65" />
      <!-- desna strana -->
      <rect x="333" y="230" width="4" height="60" fill="gray" />
      <rect x="417" y="300" width="7" height="60" fill="gray" />
      <polygon points="335,180 315,270 355,270" fill="#337d65" />

      <polygon points="420,180 390,340 450,340" fill="#337d65" />
    </svg>

    <h1>Zadatak 3</h1>
    <svg width="600" height="500">
      <circle cx="300" cy="250" r="170" fill="#ce485c" />
      <circle
        cx="300"
        cy="32"
        r="30"
        fill="white"
        stroke="#f7945b"
        stroke-width="3"
      />
      <rect x="250" y="55" width="100" height="55" fill="#f7945b" />
    </svg>

    <h1>Zadatak 4</h1>
    <svg width="600" height="700">
      <rect x="263" y="500" width="80" height="65" fill="maroon" />

      <polygon points="300,300 150,500 450,500" fill="#204438" />
      <polygon points="300,200 180,400 420,400" fill="#025D4B" />
      <polygon points="300,130 210,300 390,300" fill="#36755A" />
    </svg>

    <h1>Zadatak 5</h1>
    <svg width="600" height="700">
      <rect
        x="140"
        y="130"
        width="160"
        height="85"
        rx="42.5"
        ry="42.5"
        fill="#c67a34"
      />
      <rect
        x="300"
        y="130"
        width="160"
        height="85"
        rx="42.5"
        ry="42.5"
        fill="#c67a34"
      />

      <rect
        x="225"
        y="100"
        width="150"
        height="220"
        rx="110"
        ry="110"
        fill="#c67a34"
      />

      <rect
        x="200"
        y="220"
        width="85"
        height="180"
        rx="42.5"
        ry="42.5"
        fill="#c67a34"
        transform="rotate(18, 197.5, 360)"
      />
      <rect
        x="310"
        y="250"
        width="85"
        height="180"
        rx="42.5"
        ry="42.5"
        fill="#c67a34"
        transform="rotate(-18, 302.5, 360)"
      />

      <circle cx="300" cy="82" r="70" fill="#c67a34" />
      <circle cx="275" cy="75" r="8" fill="white" />
      <circle cx="325" cy="75" r="8" fill="white" />
      <circle cx="300" cy="180" r="12" fill="black" />
      <circle cx="300" cy="230" r="12" fill="black" />

      <rect
        x="275"
        y="100"
        width="50"
        height="10"
        rx="5"
        ry="5"
        fill="#c67a34"
        stroke="white"
        stroke-width="3"
      />
    </svg>
    <h1>Zadatak 6</h1>
    <svg width="600" height="700">
      <rect width="100%" height="100%" fill="white" />

      <path
        d="M 250,250 L 380,160 A 150,150 0 1,0 380,340 Z"
        fill="#F2F000"
        stroke="black"
        stroke-width="8"
      />

      <circle cx="250" cy="165" r="20" fill="black" />
    </svg>
  </body>
</html>
